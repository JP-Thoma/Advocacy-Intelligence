<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Recommendation Consistency Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b3a8c"/>
      <stop offset="1" stop-color="#1e2a5a"/>
    </linearGradient>
    <!-- Cuts a gap around the front sheet so the two sheets read as separate -->
    <mask id="gap">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="11.5" y="8.5" width="16" height="19" rx="4" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="6" y="6" width="13" height="16" rx="2.5" fill="#fff" fill-opacity=".32" mask="url(#gap)"/>
  <rect x="13" y="10" width="13" height="16" rx="2.5" fill="#fff"/>
  <rect x="16" y="14" width="7" height="2" rx="1" fill="#2b3a8c"/>
  <rect x="16" y="17" width="7" height="2" rx="1" fill="#2b3a8c"/>
  <rect x="16" y="20" width="4" height="2" rx="1" fill="#2b3a8c"/>
</svg>
